<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enviar a imprimir</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="wrap narrow">
  <header class="top">
    <div class="logo">🖨️</div>
    <div>
      <h1 id="school">Asistente de Impresión</h1>
      <p class="muted">Envía tu archivo y retíralo en la impresora.</p>
    </div>
  </header>

  <form id="form" class="card">
    <label class="drop" id="drop">
      <input type="file" name="file" id="file" multiple required>
      <span class="drop-icon">📄</span>
      <strong id="drop-text">Toca para elegir el archivo</strong>
      <small class="muted">o arrástralo aquí (PC) · PDF, imágenes, Word, Excel, PowerPoint</small>
    </label>
    <ul id="file-list" class="file-list"></ul>

    <div class="field">
      <label for="teacher">Tu nombre</label>
      <input id="teacher" name="teacher" required maxlength="60" placeholder="Prof. Ana Pérez" autocomplete="name">
    </div>

    <div class="row">
      <div class="field">
        <label for="copies">Copias</label>
        <input id="copies" name="copies" type="number" min="1" max="200" value="1" inputmode="numeric">
      </div>
      <div class="field checks">
        <label class="check"><input type="checkbox" name="duplex"> Doble cara</label>
        <label class="check"><input type="checkbox" name="color"> Color</label>
      </div>
    </div>

    <div class="field">
      <label for="notes">Notas (opcional)</label>
      <input id="notes" name="notes" maxlength="300" placeholder="Ej: grapado, solo páginas 1-3, para 5°B…">
    </div>

    <div class="field" id="code-field" hidden>
      <label for="code">Código de acceso</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="off">
    </div>

    <div class="progress" id="progress" hidden><div id="bar"></div></div>
    <button class="btn primary big" id="send" type="submit">Enviar a imprimir</button>
    <p id="msg" class="msg" role="status"></p>
  </form>
</main>

<script>
const $ = s => document.querySelector(s);
const fileInput = $('#file');
let maxMb = 50;

fetch('/api/info').then(r => r.json()).then(info => {
  $('#school').textContent = info.school_name;
  document.title = 'Enviar a imprimir · ' + info.school_name;
  $('#code-field').hidden = !info.needs_code;
  $('#code').required = info.needs_code;
  maxMb = info.max_mb;
});

try {
  $('#teacher').value = localStorage.getItem('teacher') || '';
  $('#code').value = localStorage.getItem('code') || '';
} catch (e) {}

function showFiles() {
  const list = $('#file-list');
  list.innerHTML = '';
  for (const f of fileInput.files) {
    const li = document.createElement('li');
    li.textContent = `${f.name} · ${(f.size / 1048576).toFixed(1)} MB`;
    list.appendChild(li);
  }
  $('#drop-text').textContent = fileInput.files.length
    ? `${fileInput.files.length} archivo(s) seleccionado(s)` : 'Toca para elegir el archivo';
}
fileInput.addEventListener('change', showFiles);

const drop = $('#drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { fileInput.files = e.dataTransfer.files; showFiles(); });

$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const msg = $('#msg');
  const total = [...fileInput.files].reduce((a, f) => a + f.size, 0);
  if (total > maxMb * 1048576) {
    msg.className = 'msg err'; msg.textContent = `El archivo supera ${maxMb} MB.`; return;
  }
  try {
    localStorage.setItem('teacher', $('#teacher').value);
    localStorage.setItem('code', $('#code').value);
  } catch (e) {}

  const files = [...fileInput.files];
  $('#progress').hidden = false;
  $('#send').disabled = true;
  sendNext(files, 0);
});

// Envía los archivos uno por uno. Los textos van con encodeURIComponent
// para que tildes y ñ lleguen bien a la tablet.
function sendNext(files, i) {
  const msg = $('#msg');
  const done = () => { $('#send').disabled = false; $('#progress').hidden = true; };
  if (i >= files.length) {
    done();
    msg.className = 'msg ok';
    msg.textContent = files.length > 1
      ? `✅ ¡Listo! ${files.length} archivos están en la cola de impresión.`
      : '✅ ¡Listo! Tu archivo está en la cola de impresión.';
    fileInput.value = ''; showFiles();
    $('#copies').value = 1; $('#notes').value = '';
    return;
  }
  const f = files[i];
  const enc = id => encodeURIComponent($(id).value.trim());
  const fd = new FormData();
  fd.append('teacher', enc('#teacher'));
  fd.append('copies', enc('#copies'));
  fd.append('notes', enc('#notes'));
  fd.append('code', enc('#code'));
  if ($('[name=duplex]').checked) fd.append('duplex', 'on');
  if ($('[name=color]').checked) fd.append('color', 'on');
  fd.append('fname', encodeURIComponent(f.name));
  fd.append('file', f, 'archivo');

  msg.className = 'msg';
  msg.textContent = files.length > 1 ? `Enviando ${i + 1} de ${files.length}: ${f.name}…` : 'Enviando…';
  $('#bar').style.width = '0%';
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload');
  xhr.upload.onprogress = ev => { if (ev.lengthComputable) $('#bar').style.width = (ev.loaded / ev.total * 100) + '%'; };
  xhr.onload = () => {
    let res = {}; try { res = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status === 200) return sendNext(files, i + 1);
    done();
    msg.className = 'msg err';
    msg.textContent = '❌ ' + f.name + ': ' + (res.error || 'Error al enviar');
  };
  xhr.onerror = () => {
    done();
    msg.className = 'msg err';
    msg.textContent = '❌ No se pudo conectar con la tablet. ¿Estás en la misma red Wi-Fi y la app está abierta?';
  };
  xhr.send(fd);
}
</script>
</body>
</html>
