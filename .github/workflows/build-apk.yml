name: Compilar APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: ./gradlew --no-daemon assembleDebug

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AsistenteImpresion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AsistenteImpresion-apk
          path: AsistenteImpresion.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.ref_name == 'main' && 'latest' || 'dev' }}
          name: Asistente de Impresión (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'main' }}
          files: AsistenteImpresion.apk
          body: |
            Descarga **AsistenteImpresion.apk** desde la tablet e instálalo.
            Compilado desde `${{ github.sha }}`.
